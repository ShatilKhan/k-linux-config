# /etc/modprobe.d/zz-k-nvidia.conf  (installed by scripts/30-gpu.sh)
# Kernel mode setting for the NVIDIA DRM driver (needed for Wayland and clean suspend/resume).
options nvidia_drm modeset=1
# Save GPU memory over suspend, to a disk-backed path (not tmpfs).
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
# Open driver: let the kernel notify the driver at suspend/resume instead of the
# nvidia-suspend/resume/hibernate systemd units (those units get masked).
options nvidia NVreg_UseKernelSuspendNotifiers=1
