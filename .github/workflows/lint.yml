name: lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x bootstrap.sh scripts/*.sh .githooks/pre-commit
      - run: for f in bootstrap.sh scripts/*.sh; do bash -n "$f"; done
